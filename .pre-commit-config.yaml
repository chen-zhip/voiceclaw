default_language_version:
  node: '22'

default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json

  - repo: local
    hooks:
      - id: prettier
        name: Prettier (staged files)
        entry: yarn prettier --write --ignore-unknown
        language: system
        files: \.(cjs|css|graphql|html|js|json|jsx|md|mdx|mjs|scss|ts|tsx|yaml|yml)$

      - id: eslint-website
        name: ESLint (website)
        entry: yarn lint:web --fix
        language: system
        files: ^website/.*\.(cjs|js|jsx|mjs|ts|tsx)$
        pass_filenames: false

      - id: typescript
        name: TypeScript type check
        entry: yarn typecheck:all
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
