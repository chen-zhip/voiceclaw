default_language_version:
  node: '22'

default_stages:
  - pre-commit

repos:
  # Fast repository hygiene checks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json

  # Use this repository's Prettier version and Tailwind plugin.
  - repo: local
    hooks:
      - id: prettier
        name: Prettier (staged files)
        entry: yarn prettier --write --ignore-unknown
        language: system
        files: \.(cjs|css|graphql|html|js|json|jsx|md|mdx|mjs|scss|ts|tsx|yaml|yml)$

      # ESLint is currently configured only for the website workspace.
      - id: eslint-website
        name: ESLint (website)
        entry: yarn lint:web --fix
        language: system
        files: ^website/.*\.(cjs|js|jsx|mjs|ts|tsx)$
        pass_filenames: false

      # TypeScript is checked across every installed Yarn workspace.
      - id: typescript
        name: TypeScript type check
        entry: yarn typecheck
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false

  # Prevent credentials generated or copied by an agent from being committed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  # Conventional commit messages; install the commit-msg stage separately.
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.8.3
    hooks:
      - id: commitizen
        stages:
          - commit-msg
